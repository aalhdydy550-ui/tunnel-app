[versions]
# Verified 2026-11-23 on Maven Central / Google Maven (maven-metadata.xml).
# Kotlin 2.3.21 is the newest stable line with a matching KSP release (2.3.14).
# AGP 8.13.2 is the newest 8.x stable line and pairs with Gradle 8.14.8
# (AGP 9.x requires Gradle 9.x, so it is deliberately NOT used here).
# Hilt is pinned to 2.58: it is the newest Hilt whose Gradle plugin works
# with AGP 8.13.2. Verified 2026-11-24 from the plugin binaries:
# Hilt 2.59's HiltGradlePlugin references
# ScopedArtifact$POST_COMPILATION_CLASSES, an enum constant that exists
# only in AGP 9.x (AGP 8.13.2's ScopedArtifact has only CLASSES and
# JAVA_RES) — so 2.59 fails project ':app' configuration with
# "Failed to notify project evaluation listener" before any test runs
# (CI run 41). Hilt 2.57.2 and 2.58 are clean (no such reference).
# Do NOT bump Hilt past 2.58 without upgrading AGP to 9.x first
# (AGP 9.0.0 exists, but it requires Gradle 9.x).
# Dependency ceiling for AGP 8.13.2 + compileSdk 36 (CI run 42):
# ':app:checkDebugAarMetadata' fails when any AAR declares
# minCompileSdk > 36 or minAgpVersion > 8.13.2. Verified 2026-11-24
# from each AAR's aar-metadata.properties: Compose 1.12.x, core-ktx
# 1.19.x, lifecycle 2.11.x and hilt-navigation-compose 1.4.0 all
# require SDK 37 + AGP 9.1.0. Newest versions that pass:
# Compose BOM 2026.06.01 (compose 1.11.4, material3 1.4.0;
# SDK 35 / AGP 8.6.0), core-ktx 1.18.0 (SDK 36 / AGP 8.9.1),
# lifecycle 2.10.0 (SDK 35 / AGP 8.6.0), hilt-navigation-compose
# 1.3.0 (SDK 35 / AGP 8.6.0). activity-compose 1.13.0 passes as-is
# (SDK 36 / AGP 8.9.1). Do NOT bump any of these without re-checking
# the AAR metadata against AGP 8.13.2 + compileSdk 36.
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.14"
hilt = "2.58"
composeBom = "2026.06.01"
room = "2.8.5"
workmanager = "2.12.0"
okhttp = "4.12.0"
serialization = "1.13.0"
coroutines = "1.11.0"
lifecycle = "2.10.0"
hiltNavigationCompose = "1.3.0"
activityCompose = "1.13.0"
coreKtx = "1.18.0"
datastore = "1.3.0"
junit = "4.13.2"
robolectric = "4.15.1"
mockk = "1.14.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
